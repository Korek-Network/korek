name: Build KOREK Wallet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["wallet/**", ".github/workflows/wallet-build.yml"]
    tags: ["wallet-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            command: dist:linux
          - os: windows-latest
            command: dist:windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: korek-wallet-${{ runner.os }}
          path: wallet/dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/wallet-v') && github.ref_name || 'wallet-testnet-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/wallet-v') && github.ref_name || 'KOREK Wallet — Latest Testnet' }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/wallet-v') }}
          overwrite_files: true
